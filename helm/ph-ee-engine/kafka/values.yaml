enabled: true
replicas: 1
image: "apache/kafka"
imageTag: "4.3.1"
imagePullPolicy: "IfNotPresent"
nodePort: 30092
advertised:
  host: "kafka"
  port: "9092"
# Fixed KRaft cluster id (base64 UUID). Keep it stable: a persisted log dir formatted
# with a different id refuses to start.
clusterId: "Kex3emHGSJSKbQVLxW0v_w"
# Image default is 1G heap; keep below limits.memory.
heapOpts: "-Xmx512m -Xms512m"
persistence:
  enabled: false
  # One topic, one partition, 7-day default retention. PVCs grow but never shrink, so start small.
  size: 2Gi
  storageClass: ""
# apache/kafka runs as uid 1000 (appuser); fsGroup makes the data volume writable.
podSecurityContext:
  fsGroup: 1000
limits:
  cpu: "500m"
  memory: "1G"
requests:
  cpu: "100m"
  memory: "512M"
deployment:
  annotations:
    deployTime: "{{ .Values.deployTime }}"
