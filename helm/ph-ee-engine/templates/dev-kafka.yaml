{{- if .Values.kafka.enabled -}}
# Single-node Apache Kafka in KRaft mode (broker and controller in one process). Ported from the
# kafka subchart on master (FD-1928) to this chart's flat layout; values live under `kafka`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  # Single-node KRaft: node id, quorum voter and data volume are fixed, so more than one pod
  # would start as the same broker. A multi-broker setup needs a StatefulSet with per-pod ids.
  {{- if ne (int (.Values.kafka.replicas | default 1)) 1 }}
  {{- fail "kafka.replicas must be 1: this Deployment runs a single-node KRaft broker (node id 1, one data volume)" }}
  {{- end }}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      {{- with .Values.kafka.deployment.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.kafka.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image }}:{{ .Values.kafka.imageTag }}"
          imagePullPolicy: "{{ .Values.kafka.imagePullPolicy }}"
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          # The apache/kafka image drops its bundled server.properties as soon as any KAFKA_* env
          # is set, so the whole config must be spelled out here. Internal topics use replication
          # factor 1.
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Clients follow the advertised address after bootstrap. A bare Service name only
            # resolves inside this namespace, so qualify it for clients elsewhere in the cluster
            # (KEDA's Kafka scaler runs in its own namespace). A host containing a dot is used as is.
            {{- $host := .Values.kafka.advertised.host }}
            {{- if not (contains "." $host) }}{{ $host = printf "%s.%s.svc.cluster.local" $host .Release.Namespace }}{{ end }}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ $host }}:{{ .Values.kafka.advertised.port }}"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Default partition count for topics created without an explicit count (auto-created by a
            # consumer's metadata request, or by an exporter build that does not pass one). Matches the
            # importers' maximum replica count.
            - name: KAFKA_NUM_PARTITIONS
              value: "{{ .Values.kafka.numPartitions }}"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: CLUSTER_ID
              value: "{{ .Values.kafka.clusterId }}"
            - name: KAFKA_HEAP_OPTS
              value: "{{ .Values.kafka.heapOpts }}"
            {{- with .Values.kafka.extraEnvs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            limits:
              memory: "{{ .Values.kafka.limits.memory }}"
              cpu: "{{ .Values.kafka.limits.cpu }}"
            requests:
              memory: "{{ .Values.kafka.requests.memory }}"
              cpu: "{{ .Values.kafka.requests.cpu }}"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: data
          {{- if .Values.kafka.persistence.enabled }}
          persistentVolumeClaim:
            claimName: kafka-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.kafka.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  labels:
    app: kafka
  annotations:
    # Survive helm rollback/uninstall; delete the PVC by hand when the data is no longer wanted.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.kafka.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.kafka.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - protocol: TCP
    port: 9092
    nodePort: {{ .Values.kafka.nodePort }}
  type: NodePort
{{- end }}
