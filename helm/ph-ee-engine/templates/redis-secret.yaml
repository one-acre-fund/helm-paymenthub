# Explicit Secret for the shared Redis password (see the `redis:`/`paymenthubredis:`
# blocks in values.yaml), created the same way every other credential in this chart is
# (an explicit Secret template reading a values.yaml field) rather than relying on the
# bundled paymenthubredis subchart to create its own - see mpesa-secret-* in
# connector-mpesa.yaml or operations-app-secret in operations-app.yaml for the same
# pattern. The paymenthubredis subchart is pointed at this same secret via its own
# auth.existingSecret, so whichever Redis is actually running (the bundled subchart, or
# an external instance if `redis.enabled: false`), connectors and the subchart agree on
# one password.
apiVersion: {{ .Values.secret.apiversion }}
kind: Secret
metadata:
  name: paymenthub-redis
type: Opaque
data:
  redis-password: {{ .Values.redis.password | b64enc }}
